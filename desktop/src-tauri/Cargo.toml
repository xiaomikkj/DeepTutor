[package]
name = "deeptutor-desktop"
version = "0.1.0"
description = "DeepTutor Windows Desktop Client"
authors = ["DeepTutor"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "deeptutor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
